<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.55" stop-color="#2C5BE6"/>
      <stop offset="1" stop-color="#14268F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#B9CCFF"/>
    </linearGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0A1550" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background squircle -->
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#bg)"/>
  <!-- subtle top highlight -->
  <rect x="96" y="96" width="832" height="416" rx="196" fill="#ffffff" opacity="0.06"/>

  <g filter="url(#softshadow)">
    <!-- monitor bezel -->
    <rect x="262" y="286" width="500" height="366" rx="44" fill="#ffffff"/>
    <!-- screen / desktop -->
    <rect x="296" y="320" width="432" height="298" rx="22" fill="url(#screen)"/>
    <!-- menu bar strip at top of screen (nods to "DeXBar") -->
    <path d="M296 342 a22 22 0 0 1 22 -22 h388 a22 22 0 0 1 22 22 v26 h-432 z" fill="#ffffff" opacity="0.95"/>
    <circle cx="326" cy="342" r="7" fill="#2C5BE6"/>
    <rect x="612" y="335" width="96" height="14" rx="7" fill="#2C5BE6" opacity="0.55"/>
    <!-- a floating desktop window -->
    <rect x="452" y="404" width="238" height="176" rx="18" fill="#ffffff" opacity="0.9"/>
    <rect x="452" y="404" width="238" height="40" rx="18" fill="#2C5BE6" opacity="0.18"/>
    <!-- monitor stand -->
    <rect x="476" y="652" width="72" height="58" fill="#ffffff"/>
    <rect x="388" y="704" width="248" height="36" rx="18" fill="#ffffff"/>
  </g>
</svg>
