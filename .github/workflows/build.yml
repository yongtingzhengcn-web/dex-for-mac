name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write   # needed for the release job to upload assets

jobs:
  build:
    name: Build DeXBar.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: ./app/build.sh

      - name: Package (.zip)
        run: |
          cd app/build
          ditto -c -k --keepParent DeXBar.app DeXBar-macos.zip
          shasum -a 256 DeXBar-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeXBar-macos
          path: app/build/DeXBar-macos.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./app/build.sh

      - name: Package (.zip)
        run: |
          cd app/build
          ditto -c -k --keepParent DeXBar.app DeXBar-macos.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/DeXBar-macos.zip
          generate_release_notes: true
          body: |
            Prebuilt **DeXBar.app** for macOS (Apple Silicon / Intel universal via the runner).

            The app is ad-hoc signed, not notarized. On first launch, right-click the app
            and choose **Open**, or allow it under **System Settings → Privacy & Security**.

            Requires `scrcpy` + `adb`:
            `brew install scrcpy && brew install --cask android-platform-tools`
