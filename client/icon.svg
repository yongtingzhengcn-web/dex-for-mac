<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A8CFF"/>
      <stop offset="0.5" stop-color="#5A48E0"/>
      <stop offset="1" stop-color="#2E1B8F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0EAFF"/>
      <stop offset="1" stop-color="#C4B9FF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#B9A9FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9A9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#120A50" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- background squircle -->
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#bg)"/>
  <!-- subtle top highlight -->
  <rect x="96" y="96" width="832" height="416" rx="196" fill="#ffffff" opacity="0.06"/>

  <!-- projection beam from phone to window -->
  <path d="M660 720 L470 380 L760 360 L780 700 Z" fill="url(#beam)"/>

  <g filter="url(#softshadow)">
    <!-- macOS-style window -->
    <rect x="212" y="242" width="560" height="420" rx="34" fill="#ffffff"/>
    <!-- title bar with traffic lights -->
    <path d="M212 276 a34 34 0 0 1 34 -34 h492 a34 34 0 0 1 34 34 v34 h-560 z" fill="#EFEAFB"/>
    <circle cx="252" cy="276" r="11" fill="#FF5F57"/>
    <circle cx="286" cy="276" r="11" fill="#FEBC2E"/>
    <circle cx="320" cy="276" r="11" fill="#28C840"/>
    <!-- window content: desktop -->
    <rect x="244" y="330" width="496" height="300" rx="20" fill="url(#screen)"/>
    <!-- desktop taskbar -->
    <rect x="244" y="588" width="496" height="42" rx="20" fill="#ffffff" opacity="0.85"/>
    <circle cx="290" cy="609" r="12" fill="#5A48E0"/>
    <circle cx="330" cy="609" r="12" fill="#8F7BFF"/>
    <circle cx="370" cy="609" r="12" fill="#B9A9FF"/>
    <!-- floating app windows on the desktop -->
    <rect x="300" y="376" width="220" height="150" rx="14" fill="#ffffff" opacity="0.92"/>
    <rect x="300" y="376" width="220" height="34" rx="14" fill="#5A48E0" opacity="0.2"/>
    <rect x="470" y="430" width="220" height="130" rx="14" fill="#ffffff"/>
    <rect x="470" y="430" width="220" height="34" rx="14" fill="#5A48E0" opacity="0.32"/>
    <!-- phone feeding the window -->
    <rect x="640" y="640" width="150" height="270" rx="34" fill="#1B1450"/>
    <rect x="654" y="658" width="122" height="234" rx="24" fill="url(#screen)"/>
    <rect x="694" y="870" width="42" height="8" rx="4" fill="#8F7BFF"/>
  </g>
</svg>
